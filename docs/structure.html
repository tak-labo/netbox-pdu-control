<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netbox-pdu-control — Structure</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666;
    --panel-bg: #f7f7f9;
    --border: #e0e0e0;
    --edge: #b6b6c0;
    --edge-dashed: #c9c9d4;
    --col-plugin: #3b6fd6;
    --col-netbox: #2f9e6e;
    --col-external: #d17a1f;
    --col-model: #7654d6;
    --col-model-ext: #999;
    --node-fg: #ffffff;
    --tab-bg: #eeeef2;
    --tab-active-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --fg: #e8e8ee;
      --muted: #9a9aa5;
      --panel-bg: #1d1e25;
      --border: #2c2d36;
      --edge: #4a4b58;
      --edge-dashed: #3a3b46;
      --tab-bg: #1d1e25;
      --tab-active-bg: #24252e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151a; --fg: #e8e8ee; --muted: #9a9aa5; --panel-bg: #1d1e25;
    --border: #2c2d36; --edge: #4a4b58; --edge-dashed: #3a3b46;
    --tab-bg: #1d1e25; --tab-active-bg: #24252e;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --panel-bg: #f7f7f9;
    --border: #e0e0e0; --edge: #b6b6c0; --edge-dashed: #c9c9d4;
    --tab-bg: #eeeef2; --tab-active-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tabs { display: flex; gap: 2px; background: var(--tab-bg); border-radius: 8px; padding: 3px; }
  .tabs button {
    border: none; background: transparent; color: var(--fg);
    padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: var(--tab-active-bg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-left: auto; flex-wrap: wrap; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #panel {
    width: 300px; flex-shrink: 0; border-left: 1px solid var(--border);
    background: var(--panel-bg); padding: 16px; overflow-y: auto;
  }
  #panel h2 { font-size: 14px; margin: 0 0 6px; }
  #panel .path { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; margin-bottom: 10px; word-break: break-all; }
  #panel .desc { font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
  #panel ul { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; }
  #panel .empty { color: var(--muted); font-size: 13px; }
  #panel .hint { color: var(--muted); font-size: 12px; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 10px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls button {
    border: 1px solid var(--border); background: var(--panel-bg); color: var(--fg);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--muted); }
  @media (max-width: 720px) {
    #panel { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>netbox-pdu-control</h1>
    <span class="sub">アプリ全体の構造</span>
    <div class="tabs">
      <button id="tabModules" class="active">モジュール構成</button>
      <button id="tabModels">データモデル</button>
    </div>
    <div class="controls">
      <button id="btnReset">レイアウトをリセット</button>
    </div>
    <div class="legend" id="legend"></div>
  </header>
  <main>
    <div id="canvasWrap"><canvas id="canvas"></canvas></div>
    <div id="panel"><p class="empty">ノードをクリックすると詳細が表示されます。ドラッグで位置を調整できます。</p></div>
  </main>
</div>

<script>
"use strict";

// ---- Load data -----------------------------------------------------------
const DATA_URL = "structure.json";
let DATA = null;

fetch(DATA_URL)
  .then(r => r.json())
  .then(json => { DATA = json; init(); })
  .catch(err => {
    document.getElementById("panel").innerHTML =
      '<p class="empty">structure.json の読み込みに失敗しました。'
      + 'file:// で直接開いた場合はブラウザのCORS制限が原因のことがあります。'
      + '<code>python3 -m http.server</code> 等で docs/ を配信して開いてください。<br><br>'
      + String(err) + '</p>';
  });

// ---- Palette ---------------------------------------------------------------
const GROUP_COLOR = {
  plugin: "#3b6fd6",
  netbox: "#2f9e6e",
  external: "#d17a1f",
};
const MODEL_COLOR = "#7654d6";
const MODEL_EXT_COLOR = "#8a8a95";

// ---- Simulation state --------------------------------------------------
let canvas, ctx, W, H, DPR;
let currentTab = "modules";
let nodes = [];   // {id,label,x,y,vx,vy,r,color,group,desc,path,fields,external}
let links = [];   // {source,target,label,dashed} (source/target are node refs after resolve)
let dragNode = null, dragOffX = 0, dragOffY = 0, hasDragged = false;
let selected = null;
let panX = 0, panY = 0, panning = false, panStartX = 0, panStartY = 0;
let rafId = null;

function init() {
  canvas = document.getElementById("canvas");
  ctx = canvas.getContext("2d");
  resize();
  window.addEventListener("resize", resize);

  document.getElementById("tabModules").addEventListener("click", () => switchTab("modules"));
  document.getElementById("tabModels").addEventListener("click", () => switchTab("models"));
  document.getElementById("btnReset").addEventListener("click", () => buildGraph(currentTab, true));

  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", onTouchStart, {passive: false});
  canvas.addEventListener("touchmove", onTouchMove, {passive: false});
  canvas.addEventListener("touchend", onUp);

  buildGraph("modules", true);
  tick();
}

function resize() {
  DPR = window.devicePixelRatio || 1;
  const wrap = document.getElementById("canvasWrap");
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function switchTab(tab) {
  if (tab === currentTab) return;
  currentTab = tab;
  document.getElementById("tabModules").classList.toggle("active", tab === "modules");
  document.getElementById("tabModels").classList.toggle("active", tab === "models");
  selected = null;
  renderPanel();
  buildGraph(tab, true);
}

function buildGraph(tab, resetPositions) {
  if (!DATA) return;
  const src = tab === "modules" ? DATA.modules : DATA.models;
  const byId = {};
  nodes = src.nodes.map((n, i) => {
    const isModuleTab = tab === "modules";
    const color = isModuleTab
      ? (GROUP_COLOR[n.group] || "#888")
      : (n.external ? MODEL_EXT_COLOR : MODEL_COLOR);
    const r = isModuleTab ? (n.group === "plugin" ? 26 : 22) : (n.external ? 24 : 30);
    const angle = (i / src.nodes.length) * Math.PI * 2;
    const radius = Math.min(W, H) * 0.32;
    const node = {
      id: n.id, label: n.label, desc: n.desc || "", path: n.path || "",
      fields: n.fields || null, group: n.group, external: !!n.external,
      color, r,
      x: W / 2 + Math.cos(angle) * radius + (Math.random() - 0.5) * 20,
      y: H / 2 + Math.sin(angle) * radius + (Math.random() - 0.5) * 20,
      vx: 0, vy: 0,
    };
    byId[n.id] = node;
    return node;
  });
  links = src.links.map(l => ({
    source: byId[l.source], target: byId[l.target],
    label: l.label || "", dashed: !!l.dashed,
  }));
  panX = 0; panY = 0;
  renderLegend(tab);
}

function renderLegend(tab) {
  const el = document.getElementById("legend");
  if (tab === "modules") {
    el.innerHTML = [
      ["plugin", "netbox_pdu_control 内"],
      ["netbox", "NetBox本体"],
      ["external", "外部(実機PDU / git)"],
    ].map(([g, label]) =>
      `<span><span class="dot" style="background:${GROUP_COLOR[g]}"></span>${label}</span>`
    ).join("");
  } else {
    el.innerHTML =
      `<span><span class="dot" style="background:${MODEL_COLOR}"></span>プラグインのモデル</span>` +
      `<span><span class="dot" style="background:${MODEL_EXT_COLOR}"></span>NetBoxコアモデル(参照のみ)</span>`;
  }
}

// ---- Force simulation (naive, no deps) ----------------------------------
function step() {
  const REPULSE = 2600;
  const SPRING_LEN = 150;
  const SPRING_K = 0.02;
  const CENTER_K = 0.002;
  const DAMPING = 0.85;

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a === dragNode) continue;
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let distSq = dx * dx + dy * dy;
      if (distSq < 1) distSq = 1;
      const dist = Math.sqrt(distSq);
      const force = REPULSE / distSq;
      const fx = (dx / dist) * force, fy = (dy / dist) * force;
      a.vx += fx; a.vy += fy;
      if (b !== dragNode) { b.vx -= fx; b.vy -= fy; }
    }
    a.vx += (W / 2 - a.x) * CENTER_K;
    a.vy += (H / 2 - a.y) * CENTER_K;
  }

  for (const l of links) {
    const a = l.source, b = l.target;
    let dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    const diff = dist - SPRING_LEN;
    const fx = (dx / dist) * diff * SPRING_K, fy = (dy / dist) * diff * SPRING_K;
    if (a !== dragNode) { a.vx += fx; a.vy += fy; }
    if (b !== dragNode) { b.vx -= fx; b.vy -= fy; }
  }

  for (const n of nodes) {
    if (n === dragNode) continue;
    n.vx *= DAMPING; n.vy *= DAMPING;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(n.r, Math.min(W - n.r, n.x));
    n.y = Math.max(n.r, Math.min(H - n.r, n.y));
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(panX, panY);

  const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const rootTheme = document.documentElement.getAttribute("data-theme");
  const dark = rootTheme ? rootTheme === "dark" : isDark;
  const edgeColor = dark ? "#4a4b58" : "#b6b6c0";
  const edgeDashColor = dark ? "#3a3b46" : "#c9c9d4";
  const textColor = dark ? "#e8e8ee" : "#1a1a1a";
  const labelBg = dark ? "rgba(20,21,26,0.85)" : "rgba(255,255,255,0.85)";

  ctx.lineWidth = 1.4;
  for (const l of links) {
    ctx.beginPath();
    ctx.moveTo(l.source.x, l.source.y);
    ctx.lineTo(l.target.x, l.target.y);
    ctx.strokeStyle = l.dashed ? edgeDashColor : edgeColor;
    ctx.setLineDash(l.dashed ? [4, 4] : []);
    ctx.stroke();
    ctx.setLineDash([]);
    if (l.label) {
      const mx = (l.source.x + l.target.x) / 2, my = (l.source.y + l.target.y) / 2;
      ctx.font = "10px -apple-system, sans-serif";
      const w = ctx.measureText(l.label).width;
      ctx.fillStyle = labelBg;
      ctx.fillRect(mx - w / 2 - 3, my - 7, w + 6, 13);
      ctx.fillStyle = dark ? "#aaa" : "#888";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(l.label, mx, my);
    }
  }

  for (const n of nodes) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.globalAlpha = n.external ? 0.55 : 1;
    ctx.fill();
    ctx.globalAlpha = 1;
    if (selected === n) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = dark ? "#fff" : "#111";
      ctx.stroke();
    }
    ctx.fillStyle = "#fff";
    ctx.font = "600 10.5px -apple-system, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    wrapText(n.label, n.x, n.y, n.r * 1.8, 12);
  }

  ctx.restore();
}

function wrapText(text, cx, cy, maxWidth, lineHeight) {
  const words = text.split(/(?<=[/._-])|(?=[A-Z])/).filter(Boolean);
  let lines = [], cur = "";
  for (const w of words) {
    const test = cur + w;
    if (ctx.measureText(test).width > maxWidth && cur) {
      lines.push(cur); cur = w;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  if (lines.length > 3) lines = lines.slice(0, 3);
  const startY = cy - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((line, i) => ctx.fillText(line.trim(), cx, startY + i * lineHeight));
}

function tick() {
  step();
  draw();
  rafId = requestAnimationFrame(tick);
}

// ---- Interaction ---------------------------------------------------------
function toLocal(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: clientX - rect.left - panX, y: clientY - rect.top - panY };
}

function hitTest(x, y) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = x - n.x, dy = y - n.y;
    if (dx * dx + dy * dy <= n.r * n.r) return n;
  }
  return null;
}

function onDown(e) {
  const p = toLocal(e.clientX, e.clientY);
  const n = hitTest(p.x, p.y);
  hasDragged = false;
  if (n) {
    dragNode = n; dragOffX = p.x - n.x; dragOffY = p.y - n.y;
    canvas.classList.add("dragging");
  } else {
    panning = true; panStartX = e.clientX - panX; panStartY = e.clientY - panY;
  }
}
function onMove(e) {
  if (dragNode) {
    hasDragged = true;
    const p = toLocal(e.clientX, e.clientY);
    dragNode.x = p.x - dragOffX; dragNode.y = p.y - dragOffY;
    dragNode.vx = 0; dragNode.vy = 0;
  } else if (panning) {
    panX = e.clientX - panStartX; panY = e.clientY - panStartY;
  }
}
function onUp(e) {
  if (dragNode && !hasDragged) selectNode(dragNode);
  else if (!dragNode && !panning) {}
  dragNode = null; panning = false;
  canvas.classList.remove("dragging");
}

function onTouchStart(e) {
  if (e.touches.length !== 1) return;
  e.preventDefault();
  onDown(e.touches[0]);
}
function onTouchMove(e) {
  if (e.touches.length !== 1) return;
  e.preventDefault();
  onMove(e.touches[0]);
}

function selectNode(n) {
  selected = n;
  renderPanel();
}

function renderPanel() {
  const panel = document.getElementById("panel");
  if (!selected) {
    panel.innerHTML = '<p class="empty">ノードをクリックすると詳細が表示されます。ドラッグで位置を調整できます。</p>';
    return;
  }
  let html = `<h2>${escapeHtml(selected.label)}</h2>`;
  if (selected.path) html += `<div class="path">${escapeHtml(selected.path)}</div>`;
  if (selected.desc) html += `<div class="desc">${escapeHtml(selected.desc)}</div>`;
  if (selected.fields) {
    html += "<ul>" + selected.fields.map(f => `<li>${escapeHtml(f)}</li>`).join("") + "</ul>";
  }
  const related = links.filter(l => l.source === selected || l.target === selected);
  if (related.length) {
    html += '<div class="hint">関連 (' + related.length + ')<ul>';
    for (const l of related) {
      const other = l.source === selected ? l.target : l.source;
      const dir = l.source === selected ? "→" : "←";
      html += `<li>${dir} ${escapeHtml(other.label)}${l.label ? " (" + escapeHtml(l.label) + ")" : ""}</li>`;
    }
    html += "</ul></div>";
  }
  panel.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
</script>
</body>
</html>
